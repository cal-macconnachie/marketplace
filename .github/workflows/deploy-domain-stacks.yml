name: Deploy Domain Stacks

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:
    inputs:
      force-infra:
        description: 'Infrastructure'
        required: false
        type: boolean
        default: false
      force-public:
        description: 'Public Lambdas'
        required: false
        type: boolean
        default: false
      force-payments:
        description: 'Payments Lambdas'
        required: false
        type: boolean
        default: false
      force-products:
        description: 'Products Lambdas'
        required: false
        type: boolean
        default: false
      force-internal-api:
        description: 'Internal API Lambdas'
        required: false
        type: boolean
        default: false
      force-events:
        description: 'Events'
        required: false
        type: boolean
        default: false
      force-frontend:
        description: 'Frontend'
        required: false
        type: boolean
        default: false

jobs:
  # Detect which services changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || github.event.inputs.force-infra == 'true' || github.event.inputs.force-public == 'true' || github.event.inputs.force-payments == 'true' || github.event.inputs.force-products == 'true' || github.event.inputs.force-internal-api == 'true' || github.event.inputs.force-events == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || github.event.inputs.force-frontend == 'true' }}
      env-name: ${{ steps.env.outputs.env-name }}
      force-infra: ${{ github.event.inputs.force-infra == 'true' }}
      force-public: ${{ github.event.inputs.force-public == 'true' }}
      force-payments: ${{ github.event.inputs.force-payments == 'true' }}
      force-products: ${{ github.event.inputs.force-products == 'true' }}
      force-internal-api: ${{ github.event.inputs.force-internal-api == 'true' }}
      force-events: ${{ github.event.inputs.force-events == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log API stage trigger
        run: |
          echo "API stage triggered due to: public=${{ needs.detect-stack-changes.outputs.public-changed }}, payments=${{ needs.detect-stack-changes.outputs.payments-changed }}, products=${{ needs.detect-stack-changes.outputs.products-changed }}, internal-api=${{ needs.detect-stack-changes.outputs.internal-api-changed }}"

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Set environment
        id: env
        run: echo "env-name=${{ github.ref_name }}" >> $GITHUB_OUTPUT

  # Detect specific backend stack changes
  detect-stack-changes:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    outputs:
      infra-changed: ${{ steps.check.outputs.infra-changed }}
      networking-changed: ${{ steps.check.outputs.networking-changed }}
      public-changed: ${{ steps.check.outputs.public-changed }}
      payments-changed: ${{ steps.check.outputs.payments-changed }}
      products-changed: ${{ steps.check.outputs.products-changed }}
      internal-api-changed: ${{ steps.check.outputs.internal-api-changed }}
      events-changed: ${{ steps.check.outputs.events-changed }}
      # removed granular cert/cognito changed flags; use infra-changed instead
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for pattern extraction
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check which stacks changed
        id: check
        run: |
          # Get list of changed files
          # For push events, diff against the remote branch's previous state
          # This handles multiple commits pushed at once and cross-branch scenarios
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
            # Fetch the remote branch to ensure we have the latest ref
            git fetch origin "$BRANCH_NAME" --depth=50 || true

            # Use github.event.before as the base (last commit on remote before this push)
            # Fall back to origin/BRANCH@{1} if before SHA is invalid
            if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
              BASE_SHA="${{ github.event.before }}"
            else
              # Fallback: compare against remote branch's previous state
              BASE_SHA="origin/$BRANCH_NAME"
            fi

            echo "Comparing $BASE_SHA...${{ github.sha }}"
            FILES=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          else
            # For workflow_dispatch, compare against previous commit
            FILES=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "Changed files:"
          echo "$FILES"
          echo ""

          # Check for infrastructure changes
          INFRA_CHANGED=false
          if echo "$FILES" | grep -qE "^backend/lib/(marketplace-infrastructure-stack|services/(cognito|dynamodb|s3|route53))"; then
            INFRA_CHANGED=true
          fi

          # Check for Networking stack changes (API Gateway + CloudFront combined)
          NETWORKING_CHANGED=false
          if echo "$FILES" | grep -qE "^backend/lib/(marketplace-networking-stack|services/cloudfront)"; then
            NETWORKING_CHANGED=true
          fi

          # Check for shared Lambda infrastructure changes that affect ALL domain stacks
          SHARED_LAMBDA_CHANGED=false
          if echo "$FILES" | grep -qE "^backend/lib/services/lambda/(domain-lambda-construct|bundling-configs|lambda-defaults|helpers)"; then
            SHARED_LAMBDA_CHANGED=true
          fi
          # Also treat shared workspace packages as impacting all lambdas
          if echo "$FILES" | grep -qE "^(constants/|types/)"; then
            SHARED_LAMBDA_CHANGED=true
          fi

          # Build the TS extractor and generate patterns (pure TS). Avoid relying on yarn scripts.
          if [ -f backend/node_modules/typescript/bin/tsc ]; then
            node backend/node_modules/typescript/bin/tsc -p backend/scripts/tsconfig.json
          else
            (cd backend && yarn node ./node_modules/typescript/bin/tsc -p scripts/tsconfig.json)
          fi
          STACK_VARS=$(node backend/scripts/dist/extract-handler-paths.js --bash-vars 2>/dev/null || true)

          # Eval the generated variables into this shell
          eval "$STACK_VARS"
          PUBLIC_PATTERN=${PUBLIC_PATTERN:-""}
          PAYMENTS_PATTERN=${PAYMENTS_PATTERN:-""}
          PRODUCTS_PATTERN=${PRODUCTS_PATTERN:-""}
          INTERNAL_API_PATTERN=${INTERNAL_API_PATTERN:-""}
          EVENTS_PATTERN=${EVENTS_PATTERN:-""}

          # Debug: Print generated patterns
          echo "Generated patterns:"
          echo "  PUBLIC_PATTERN: ${PUBLIC_PATTERN:0:100}..."
          echo "  PAYMENTS_PATTERN: ${PAYMENTS_PATTERN:0:100}..."
          echo "  PRODUCTS_PATTERN: ${PRODUCTS_PATTERN:0:100}..."
          echo "  INTERNAL_API_PATTERN: ${INTERNAL_API_PATTERN:0:100}..."
          echo "  EVENTS_PATTERN: ${EVENTS_PATTERN:0:100}..."
          echo ""

          # Check for domain stack changes using dynamic patterns
          PUBLIC_CHANGED=false
          if [ -n "$PUBLIC_PATTERN" ] && echo "$FILES" | grep -qE "$PUBLIC_PATTERN"; then
            PUBLIC_CHANGED=true
          fi
          if [ "$SHARED_LAMBDA_CHANGED" = "true" ]; then PUBLIC_CHANGED=true; fi

          PAYMENTS_CHANGED=false
          if [ -n "$PAYMENTS_PATTERN" ] && echo "$FILES" | grep -qE "$PAYMENTS_PATTERN"; then
            PAYMENTS_CHANGED=true
          fi
          if [ "$SHARED_LAMBDA_CHANGED" = "true" ]; then PAYMENTS_CHANGED=true; fi

          PRODUCTS_CHANGED=false
          if [ -n "$PRODUCTS_PATTERN" ] && echo "$FILES" | grep -qE "$PRODUCTS_PATTERN"; then
            PRODUCTS_CHANGED=true
          fi
          if [ "$SHARED_LAMBDA_CHANGED" = "true" ]; then PRODUCTS_CHANGED=true; fi

          INTERNAL_API_CHANGED=false
          if [ -n "$INTERNAL_API_PATTERN" ] && echo "$FILES" | grep -qE "$INTERNAL_API_PATTERN"; then
            INTERNAL_API_CHANGED=true
          fi
          if [ "$SHARED_LAMBDA_CHANGED" = "true" ]; then INTERNAL_API_CHANGED=true; fi

          EVENTS_CHANGED=false
          if [ -n "$EVENTS_PATTERN" ] && echo "$FILES" | grep -qE "$EVENTS_PATTERN"; then
            EVENTS_CHANGED=true
          fi
          if [ "$SHARED_LAMBDA_CHANGED" = "true" ]; then EVENTS_CHANGED=true; fi

          # Check for certificate and cognito domain changes
          CERTIFICATES_CHANGED=false
          if echo "$FILES" | grep -qE "^backend/(lib/marketplace-certificates-stack|bin/marketplace-certificates)"; then
            CERTIFICATES_CHANGED=true
          fi
          COGNITO_DOMAIN_CHANGED=false
          if echo "$FILES" | grep -qE "^backend/(lib/marketplace-cognito-domain-stack|bin/marketplace-cognito-domain)"; then
            COGNITO_DOMAIN_CHANGED=true
          fi

          # Apply force flags
          if [ "${{ needs.detect-changes.outputs.force-infra }}" = "true" ]; then INFRA_CHANGED=true; NETWORKING_CHANGED=true; CERTIFICATES_CHANGED=true; COGNITO_DOMAIN_CHANGED=true; fi
          if [ "${{ needs.detect-changes.outputs.force-public }}" = "true" ]; then PUBLIC_CHANGED=true; fi
          if [ "${{ needs.detect-changes.outputs.force-payments }}" = "true" ]; then PAYMENTS_CHANGED=true; fi
          if [ "${{ needs.detect-changes.outputs.force-products }}" = "true" ]; then PRODUCTS_CHANGED=true; fi
          if [ "${{ needs.detect-changes.outputs.force-internal-api }}" = "true" ]; then INTERNAL_API_CHANGED=true; fi
          if [ "${{ needs.detect-changes.outputs.force-events }}" = "true" ]; then EVENTS_CHANGED=true; fi
          if [ "${{ needs.detect-changes.outputs.force-certificates }}" = "true" ]; then CERTIFICATES_CHANGED=true; fi
          if [ "${{ needs.detect-changes.outputs.force-cognito-domain }}" = "true" ]; then COGNITO_DOMAIN_CHANGED=true; fi

          # Set outputs
          echo "infra-changed=$INFRA_CHANGED" >> $GITHUB_OUTPUT
          echo "networking-changed=$NETWORKING_CHANGED" >> $GITHUB_OUTPUT
          echo "public-changed=$PUBLIC_CHANGED" >> $GITHUB_OUTPUT
          echo "payments-changed=$PAYMENTS_CHANGED" >> $GITHUB_OUTPUT
          echo "products-changed=$PRODUCTS_CHANGED" >> $GITHUB_OUTPUT
          echo "internal-api-changed=$INTERNAL_API_CHANGED" >> $GITHUB_OUTPUT
          echo "events-changed=$EVENTS_CHANGED" >> $GITHUB_OUTPUT
          # downstream jobs use infra-changed to gate all infra: infra, certs, networking, cognito domain

          echo "Stack changes detected:"
          echo "  Infrastructure: $INFRA_CHANGED"
          echo "  Networking: $NETWORKING_CHANGED"
          echo "  Public: $PUBLIC_CHANGED"
          echo "  Payments: $PAYMENTS_CHANGED"
          echo "  Products: $PRODUCTS_CHANGED"
          echo "  Internal API: $INTERNAL_API_CHANGED"
          echo "  Events: $EVENTS_CHANGED"

  # Backend infrastructure deployment (DynamoDB, Cognito, S3, Route53)
  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: [detect-changes, detect-stack-changes]
    if: needs.detect-changes.outputs.backend == 'true' && needs.detect-stack-changes.outputs.infra-changed == 'true'
    env:
      ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      STRIPE_EVENT_DESTINATION_DEV: ${{ secrets.STRIPE_EVENT_DESTINATION_DEV }}
      STRIPE_EVENT_DESTINATION_PROD: ${{ secrets.STRIPE_EVENT_DESTINATION_PROD }}
      STRIPE_EVENT_DESTINATION_PLATFORM_DEV: ${{ secrets.STRIPE_EVENT_DESTINATION_PLATFORM_DEV }}
      STRIPE_EVENT_DESTINATION_PLATFORM_PROD: ${{ secrets.STRIPE_EVENT_DESTINATION_PLATFORM_PROD }}
      STRIPE_SECRET_KEY_DEV: ${{ secrets.STRIPE_SECRET_KEY_DEV }}
      STRIPE_SECRET_KEY_PROD: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
      EMAIL_AWS_REGION: ${{ secrets.EMAIL_AWS_REGION }}
      EMAIL_LAMBDA_ARN: ${{ secrets.EMAIL_LAMBDA_ARN }}
      SMS_LAMBDA_ARN: ${{ secrets.SMS_LAMBDA_ARN }}
      EMAIL_ASSUME_ROLE_ARN: ${{ secrets.EMAIL_ASSUME_ROLE_ARN }}
      CLOUDFRONT_AUTH_USERNAME: ${{ secrets.CLOUDFRONT_AUTH_USERNAME }}
      CLOUDFRONT_AUTH_PASSWORD: ${{ secrets.CLOUDFRONT_AUTH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: CDK Deploy Infrastructure
        working-directory: backend
        run: yarn cdk deploy MarketplaceInfrastructure-${{ needs.detect-changes.outputs.env-name }} --app "npx ts-node --prefer-ts-exts bin/marketplace-infrastructure.ts" --require-approval never -c envName=${{ needs.detect-changes.outputs.env-name }} ${{ needs.detect-changes.outputs.force-infra == 'true' && format('-c forceRedeploy={0}', github.run_number) || '' }}

  # Networking stack deployment (API Gateway + CloudFront + Cognito Custom Domain, must run after Infrastructure)
  deploy-certificates:
    runs-on: ubuntu-latest
    needs: [detect-changes, detect-stack-changes, deploy-infrastructure]
    if: |
      needs.detect-changes.outputs.backend == 'true' &&
      needs.detect-stack-changes.outputs.infra-changed == 'true' &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    env:
      ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: CDK Deploy Certificates Stack
        working-directory: backend
        run: yarn cdk deploy MarketplaceCertificates-${{ needs.detect-changes.outputs.env-name }} --app "npx ts-node --prefer-ts-exts bin/marketplace-certificates.ts" --require-approval never -c envName=${{ needs.detect-changes.outputs.env-name }}

      - name: Wait for certificate issuance
        run: |
          ENV_NAME="${{ needs.detect-changes.outputs.env-name }}"
          API_CERT_ARN=$(aws ssm get-parameter --name "/marketplace/${ENV_NAME}/acm/api-domain-cert-arn" --query "Parameter.Value" --output text)
          COGNITO_CERT_ARN=$(aws ssm get-parameter --name "/marketplace/${ENV_NAME}/acm/cognito-domain-cert-arn" --query "Parameter.Value" --output text)

          echo "Waiting for API cert to be validated: ${API_CERT_ARN}"
          aws acm wait certificate-validated --certificate-arn "$API_CERT_ARN" --region ${{ secrets.AWS_DEFAULT_REGION }}

          echo "Waiting for Cognito cert to be validated: ${COGNITO_CERT_ARN}"
          aws acm wait certificate-validated --certificate-arn "$COGNITO_CERT_ARN" --region ${{ secrets.AWS_DEFAULT_REGION }}

  deploy-networking:
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        detect-stack-changes,
        deploy-infrastructure,
        deploy-certificates
      ]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.detect-stack-changes.outputs.infra-changed == 'true' &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    env:
      ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
      CLOUDFRONT_AUTH_USERNAME: ${{ secrets.CLOUDFRONT_AUTH_USERNAME }}
      CLOUDFRONT_AUTH_PASSWORD: ${{ secrets.CLOUDFRONT_AUTH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: CDK Deploy Networking Stack
        working-directory: backend
        run: yarn cdk deploy MarketplaceNetworking-${{ needs.detect-changes.outputs.env-name }} --app "npx ts-node --prefer-ts-exts bin/marketplace-networking.ts" --require-approval never -c envName=${{ needs.detect-changes.outputs.env-name }}

  # API Gateway Resources stack (must run after Networking to create all API resources)
  deploy-api-resources:
    runs-on: ubuntu-latest
    needs: [detect-changes, detect-stack-changes, deploy-networking]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      (needs.deploy-networking.result == 'success' || needs.deploy-networking.result == 'skipped') &&
      (
        needs.detect-stack-changes.outputs.public-changed == 'true' ||
        needs.detect-stack-changes.outputs.payments-changed == 'true' ||
        needs.detect-stack-changes.outputs.products-changed == 'true' ||
        needs.detect-stack-changes.outputs.internal-api-changed == 'true'
      )
    env:
      ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: CDK Deploy API Resources Stack
        working-directory: backend
        run: yarn cdk deploy MarketplaceApiResources-${{ needs.detect-changes.outputs.env-name }} --app "npx ts-node --prefer-ts-exts bin/marketplace-api-resources.ts" --require-approval never -c envName=${{ needs.detect-changes.outputs.env-name }}

      - name: Generate API resource mapping from API Gateway
        run: |
          set -euo pipefail
          ENV_NAME="${{ needs.detect-changes.outputs.env-name }}"
          REST_API_ID=$(aws ssm get-parameter --name "/marketplace/${ENV_NAME}/api-gateway/rest-api-id" --query "Parameter.Value" --output text)
          ROOT_RESOURCE_ID=$(aws ssm get-parameter --name "/marketplace/${ENV_NAME}/api-gateway/root-resource-id" --query "Parameter.Value" --output text)
          echo "Using REST_API_ID=$REST_API_ID ROOT_RESOURCE_ID=$ROOT_RESOURCE_ID"
          # Fetch resources
          aws apigateway get-resources --rest-api-id "$REST_API_ID" --limit 500 > resources.json
          # Build path->id map (strip leading /, skip root)
          jq -r '.items[] | [.path, .id] | @tsv' resources.json | awk 'BEGIN{print "{"} {path=$1; sub(/^\//, "", path); if(path=="") next; if(n++) printf ","; printf "\"" path "\":\"" $2 "\""} END{print "}"}' > mapping.json
          mkdir -p backend/lib/.cdk-outputs
          # Compose final JSON via jq; generate timestamp via date for portability
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg rest "$REST_API_ID" \
            --arg root "$ROOT_RESOURCE_ID" \
            --arg ts "$TS" \
            --slurpfile map mapping.json \
            '{restApiId:$rest, rootResourceId:$root, resources:$map[0], generatedBy:"deploy-domain-stacks.yml", timestamp:$ts}' \
            > backend/lib/.cdk-outputs/api-resources-${ENV_NAME}.json

      - name: Upload API resource mapping
        uses: actions/upload-artifact@v4
        with:
          name: api-resources-mapping-${{ needs.detect-changes.outputs.env-name }}
          path: backend/lib/.cdk-outputs/api-resources-${{ needs.detect-changes.outputs.env-name }}.json
          if-no-files-found: error

  # Cognito custom domain stack (must run after Networking so parent A record exists)
  deploy-cognito-domain:
    runs-on: ubuntu-latest
    needs: [detect-changes, detect-stack-changes, deploy-networking]
    if: |
      needs.detect-changes.outputs.backend == 'true' &&
      needs.detect-stack-changes.outputs.infra-changed == 'true' &&
      (needs.deploy-networking.result == 'success' || needs.deploy-networking.result == 'skipped')
    env:
      ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Wait for parent DNS A record
        env:
          ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
        run: |
          # Get domain configuration from constants package (single source of truth)
          eval "$(npx tsx .github/scripts/get-domain-config.ts --env=$ENV_NAME)"

          echo "Waiting for A/AAAA record on ${DOMAIN}..."
          ATTEMPTS=0
          until nslookup "$DOMAIN" >/dev/null 2>&1 || dig +short "$DOMAIN" >/dev/null 2>&1; do
            ATTEMPTS=$((ATTEMPTS+1))
            if [ $ATTEMPTS -gt 60 ]; then
              echo "Timed out waiting for ${DOMAIN} to resolve"
              exit 1
            fi
            sleep 10
          done
          echo "${DOMAIN} resolves. Proceeding."

      - name: CDK Deploy Cognito Domain Stack
        working-directory: backend
        run: yarn cdk deploy MarketplaceCognitoDomain-${{ needs.detect-changes.outputs.env-name }} --app "npx ts-node --prefer-ts-exts bin/marketplace-cognito-domain.ts" --require-approval never -c envName=${{ needs.detect-changes.outputs.env-name }}

  # Domain Lambda stacks - All can run in parallel after API Resources stack
  # They only depend on API Resources (for API Gateway paths) and Infrastructure (for DynamoDB/Cognito)
  # No inter-dependencies between domain stacks

  deploy-internal-api:
    runs-on: ubuntu-latest
    needs: [detect-changes, detect-stack-changes, deploy-api-resources]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.detect-stack-changes.outputs.internal-api-changed == 'true' &&
      (needs.deploy-api-resources.result == 'success' || needs.deploy-api-resources.result == 'skipped')
    env:
      ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
      STRIPE_SECRET_KEY_DEV: ${{ secrets.STRIPE_SECRET_KEY_DEV }}
      STRIPE_SECRET_KEY_PROD: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API resource mapping
        uses: actions/download-artifact@v4
        with:
          name: api-resources-mapping-${{ needs.detect-changes.outputs.env-name }}
          path: backend/lib/.cdk-outputs

      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: CDK Deploy Internal API Stack
        working-directory: backend
        run: yarn cdk deploy MarketplaceInternalApi-${{ needs.detect-changes.outputs.env-name }} --app "npx ts-node --prefer-ts-exts bin/marketplace-internal-api.ts" --require-approval never -c envName=${{ needs.detect-changes.outputs.env-name }} ${{ needs.detect-changes.outputs.force-internal-api == 'true' && format('-c forceRedeploy={0}', github.run_number) || '' }}

  deploy-public:
    runs-on: ubuntu-latest
    needs: [detect-changes, detect-stack-changes, deploy-api-resources]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.detect-stack-changes.outputs.public-changed == 'true' &&
      (needs.deploy-api-resources.result == 'success' || needs.deploy-api-resources.result == 'skipped')
    env:
      ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
      STRIPE_SECRET_KEY_DEV: ${{ secrets.STRIPE_SECRET_KEY_DEV }}
      STRIPE_SECRET_KEY_PROD: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
      EMAIL_AWS_REGION: ${{ secrets.EMAIL_AWS_REGION }}
      EMAIL_LAMBDA_ARN: ${{ secrets.EMAIL_LAMBDA_ARN }}
      SMS_LAMBDA_ARN: ${{ secrets.SMS_LAMBDA_ARN }}
      EMAIL_ASSUME_ROLE_ARN: ${{ secrets.EMAIL_ASSUME_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API resource mapping
        uses: actions/download-artifact@v4
        with:
          name: api-resources-mapping-${{ needs.detect-changes.outputs.env-name }}
          path: backend/lib/.cdk-outputs

      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: CDK Deploy Public Stack
        working-directory: backend
        run: yarn cdk deploy MarketplacePublic-${{ needs.detect-changes.outputs.env-name }} --app "npx ts-node --prefer-ts-exts bin/marketplace-public.ts" --require-approval never -c envName=${{ needs.detect-changes.outputs.env-name }} ${{ needs.detect-changes.outputs.force-public == 'true' && format('-c forceRedeploy={0}', github.run_number) || '' }}

  deploy-payments:
    runs-on: ubuntu-latest
    needs: [detect-changes, detect-stack-changes, deploy-api-resources]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.detect-stack-changes.outputs.payments-changed == 'true' &&
      (needs.deploy-api-resources.result == 'success' || needs.deploy-api-resources.result == 'skipped')
    env:
      ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
      STRIPE_SECRET_KEY_DEV: ${{ secrets.STRIPE_SECRET_KEY_DEV }}
      STRIPE_SECRET_KEY_PROD: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API resource mapping
        uses: actions/download-artifact@v4
        with:
          name: api-resources-mapping-${{ needs.detect-changes.outputs.env-name }}
          path: backend/lib/.cdk-outputs

      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: CDK Deploy Payments Stack
        working-directory: backend
        run: yarn cdk deploy MarketplacePayments-${{ needs.detect-changes.outputs.env-name }} --app "npx ts-node --prefer-ts-exts bin/marketplace-payments.ts" --require-approval never -c envName=${{ needs.detect-changes.outputs.env-name }} ${{ needs.detect-changes.outputs.force-payments == 'true' && format('-c forceRedeploy={0}', github.run_number) || '' }}

  deploy-products:
    runs-on: ubuntu-latest
    needs: [detect-changes, detect-stack-changes, deploy-api-resources]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.detect-stack-changes.outputs.products-changed == 'true' &&
      (needs.deploy-api-resources.result == 'success' || needs.deploy-api-resources.result == 'skipped')
    env:
      ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
      STRIPE_SECRET_KEY_DEV: ${{ secrets.STRIPE_SECRET_KEY_DEV }}
      STRIPE_SECRET_KEY_PROD: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API resource mapping
        uses: actions/download-artifact@v4
        with:
          name: api-resources-mapping-${{ needs.detect-changes.outputs.env-name }}
          path: backend/lib/.cdk-outputs

      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: CDK Deploy Products Stack
        working-directory: backend
        run: yarn cdk deploy MarketplaceProducts-${{ needs.detect-changes.outputs.env-name }} --app "npx ts-node --prefer-ts-exts bin/marketplace-products.ts" --require-approval never -c envName=${{ needs.detect-changes.outputs.env-name }} ${{ needs.detect-changes.outputs.force-products == 'true' && format('-c forceRedeploy={0}', github.run_number) || '' }}

  # Events stack can run independently (only depends on infrastructure)
  deploy-events:
    runs-on: ubuntu-latest
    needs: [detect-changes, detect-stack-changes, deploy-infrastructure]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.detect-stack-changes.outputs.events-changed == 'true' &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped' || !needs.detect-stack-changes.outputs.infra-changed)
    env:
      ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
      STRIPE_SECRET_KEY_DEV: ${{ secrets.STRIPE_SECRET_KEY_DEV }}
      STRIPE_SECRET_KEY_PROD: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
      STRIPE_EVENT_DESTINATION_DEV: ${{ secrets.STRIPE_EVENT_DESTINATION_DEV }}
      STRIPE_EVENT_DESTINATION_PROD: ${{ secrets.STRIPE_EVENT_DESTINATION_PROD }}
      STRIPE_EVENT_DESTINATION_PLATFORM_DEV: ${{ secrets.STRIPE_EVENT_DESTINATION_PLATFORM_DEV }}
      STRIPE_EVENT_DESTINATION_PLATFORM_PROD: ${{ secrets.STRIPE_EVENT_DESTINATION_PLATFORM_PROD }}
      EMAIL_AWS_REGION: ${{ secrets.EMAIL_AWS_REGION }}
      EMAIL_LAMBDA_ARN: ${{ secrets.EMAIL_LAMBDA_ARN }}
      SMS_LAMBDA_ARN: ${{ secrets.SMS_LAMBDA_ARN }}
      EMAIL_ASSUME_ROLE_ARN: ${{ secrets.EMAIL_ASSUME_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: CDK Deploy Events Stack
        working-directory: backend
        run: yarn cdk deploy MarketplaceEvents-${{ needs.detect-changes.outputs.env-name }} --app "npx ts-node --prefer-ts-exts bin/marketplace-events.ts" --require-approval never -c envName=${{ needs.detect-changes.outputs.env-name }} ${{ needs.detect-changes.outputs.force-events == 'true' && format('-c forceRedeploy={0}', github.run_number) || '' }}

  # Single API stage redeploy after all domain jobs (runs even if earlier jobs were skipped)
  deploy-api-stage:
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        detect-stack-changes,
        deploy-api-resources,
        deploy-internal-api,
        deploy-public,
        deploy-payments,
        deploy-products
      ]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      (
        needs.detect-stack-changes.outputs.public-changed == 'true' ||
        needs.detect-stack-changes.outputs.payments-changed == 'true' ||
        needs.detect-stack-changes.outputs.products-changed == 'true' ||
        needs.detect-stack-changes.outputs.internal-api-changed == 'true'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: CDK Deploy API Stage Redeploy
        working-directory: backend
        run: yarn cdk deploy MarketplaceApiDeployment-${{ needs.detect-changes.outputs.env-name }} --app "npx ts-node --prefer-ts-exts bin/marketplace-api-deployment.ts" --require-approval never -c envName=${{ needs.detect-changes.outputs.env-name }} -c forceRedeploy=${{ github.run_number }}

  # (Removed) separate API stage job; redeploy happens at end of each domain job

  # Frontend deployment (depends on Networking for CloudFront and Infrastructure for Cognito outputs)
  # Runs after API changes to ensure frontend has latest backend endpoints
  deploy-frontend:
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        detect-stack-changes,
        deploy-networking,
        deploy-api-stage
      ]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (
        needs.deploy-api-stage.result == 'success' ||
        needs.deploy-api-stage.result == 'skipped' ||
        needs.detect-changes.outputs.backend != 'true'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend setup
        uses: ./.github/actions/backend-setup
        with:
          env-name: ${{ needs.detect-changes.outputs.env-name }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get stack outputs
        id: cfn-outputs
        run: |
          ENV_NAME="${{ needs.detect-changes.outputs.env-name }}"

          # Get domain configuration from constants package (single source of truth)
          eval "$(npx tsx .github/scripts/get-domain-config.ts --env=$ENV_NAME)"

          BUCKET_NAME=$(aws ssm get-parameter \
            --name "$BUCKET_PARAM_NAME" \
            --query "Parameter.Value" \
            --output text)

          COGNITO_REGION=$(aws cloudformation describe-stacks \
            --stack-name "MarketplaceInfrastructure-${ENV_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoRegion'].OutputValue" \
            --output text)
          COGNITO_USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name "MarketplaceInfrastructure-${ENV_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoUserPoolId'].OutputValue" \
            --output text)
          COGNITO_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name "MarketplaceInfrastructure-${ENV_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoClientId'].OutputValue" \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "MarketplaceNetworking-${ENV_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='MarketplaceDistributionId'].OutputValue" \
            --output text)

          if [ -z "$BUCKET_NAME" ] || [ -z "$DISTRIBUTION_ID" ]; then
            echo "Error: Required outputs not found"
            exit 1
          fi

          echo "bucket-name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution-id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "cognito-region=$COGNITO_REGION" >> $GITHUB_OUTPUT
          echo "cognito-user-pool-id=$COGNITO_USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "cognito-client-id=$COGNITO_CLIENT_ID" >> $GITHUB_OUTPUT

      - name: Clean frontend dist directory
        working-directory: frontend
        run: rm -rf dist

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ needs.detect-changes.outputs.env-name == 'dev' && secrets.VITE_STRIPE_PUBLISHABLE_KEY_DEV || secrets.VITE_STRIPE_PUBLISHABLE_KEY_PROD }}
          VITE_COGNITO_REGION: ${{ steps.cfn-outputs.outputs.cognito-region }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cfn-outputs.outputs.cognito-user-pool-id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.cfn-outputs.outputs.cognito-client-id }}
          VITE_API_ENV: ${{ needs.detect-changes.outputs.env-name }}
          ENV_NAME: ${{ needs.detect-changes.outputs.env-name }}
        run: yarn build

      - name: Verify build output
        working-directory: frontend
        run: |
          echo "Build directory contents:"
          ls -la dist/
          echo "Checking for index.html:"
          test -f dist/index.html && echo "✓ index.html exists" || (echo "✗ index.html missing" && exit 1)
          echo "Build timestamp: $(date)"

      - name: Upload to S3 bucket
        run: |
          echo "Syncing to s3://${{ steps.cfn-outputs.outputs.bucket-name }}"
          aws s3 sync ./frontend/dist s3://${{ steps.cfn-outputs.outputs.bucket-name }} --delete --cache-control "public,max-age=0,must-revalidate" --exclude "*.js" --exclude "*.css"
          aws s3 sync ./frontend/dist s3://${{ steps.cfn-outputs.outputs.bucket-name }} --delete --cache-control "public,max-age=31536000,immutable" --exclude "*" --include "*.js" --include "*.css"
          echo "S3 sync completed at $(date)"

      - name: Invalidate CloudFront cache
        run: |
          echo "Creating CloudFront invalidation for distribution ${{ steps.cfn-outputs.outputs.distribution-id }}"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cfn-outputs.outputs.distribution-id }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation created: ${INVALIDATION_ID}"
          echo "Waiting for invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ steps.cfn-outputs.outputs.distribution-id }} \
            --id "${INVALIDATION_ID}"
          echo "CloudFront invalidation completed at $(date)"
