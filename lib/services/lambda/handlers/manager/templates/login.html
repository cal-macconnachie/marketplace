<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Manager - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .login-header h1 {
      color: #333;
      font-size: 2rem;
      margin-bottom: 10px;
    }
    
    .login-header p {
      color: #666;
      font-size: 1rem;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #555;
    }
    
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e1e5e9;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #635bff;
    }
    
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #635bff 0%, #7c3aed 100%);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 91, 255, 0.3);
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .error-message {
      color: #dc3545;
      margin-bottom: 20px;
      padding: 10px;
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      border-radius: 4px;
    }
    
    .loading {
      text-align: center;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>Super Admin Manager</h1>
      <p>Please sign in to continue</p>
    </div>
    
    ${errorHtml}
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>
    
    <div id="loadingMessage" class="loading" style="display: none;">Signing in...</div>
  </div>
  
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const loadingMessage = document.getElementById('loadingMessage');
      
      if (!email || !password) {
        alert('Please enter both email and password');
        return;
      }
      
      loginBtn.disabled = true;
      loadingMessage.style.display = 'block';
      
      try {
        const envPrefix = 'ENV_PREFIX';
        const response = await fetch(window.location.origin + envPrefix + '/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });
        
        const result = await response.json();
        
        if (response.ok && result.idToken) {
          // Store the ID token for page authentication and access token for API calls
          localStorage.setItem('idToken', result.idToken);
          localStorage.setItem('accessToken', result.accessToken);
          
          // Reload the page, which will now include the auth token
          window.location.reload();
        } else {
          alert('Login failed: ' + (result.error || result.message || 'Unknown error'));
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Login failed: Network error');
      } finally {
        loginBtn.disabled = false;
        loadingMessage.style.display = 'none';
      }
    });
    
    // Check if we have a stored ID token for page authentication
    const storedIdToken = localStorage.getItem('idToken');
    if (storedIdToken) {
      // Try to access the protected page with the stored ID token
      fetch(window.location.href, {
        headers: {
          'Authorization': 'Bearer ' + storedIdToken
        }
      }).then(response => {
        if (response.ok) {
          response.text().then(html => {
            document.documentElement.innerHTML = html;
          });
        }
      }).catch(console.error);
    }
  </script>
</body>
</html>
